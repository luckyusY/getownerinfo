<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="640" viewBox="0 0 1920 640" role="img" aria-label="Verified Kagarama house listing banner">
  <defs>
    <clipPath id="photoClip"><rect x="1020" y="0" width="900" height="640"/></clipPath>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#e7f7fb"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#061c1f"/>
      <stop offset="0.62" stop-color="#0b3136"/>
      <stop offset="1" stop-color="#0b3136" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#061c1f" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1920" height="640" fill="url(#paper)"/>
  <g clip-path="url(#photoClip)">
    <image href="/sample-properties/kagarama-balcony.jfif" x="1000" y="-260" width="970" height="1270" preserveAspectRatio="xMidYMid slice"/>
    <rect x="1000" y="0" width="920" height="640" fill="#061c1f" opacity="0.20"/>
  </g>
  <path d="M0 0H1200C1085 118 1018 236 1018 640H0Z" fill="url(#ink)"/>
  <circle cx="1690" cy="120" r="230" fill="#15b0dd" opacity="0.14"/>
  <circle cx="1120" cy="580" r="170" fill="#faa603" opacity="0.18"/>

  <g transform="translate(118 86)">
    <rect x="0" y="0" width="168" height="36" rx="18" fill="#15b0dd"/>
    <text x="84" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#fff">VERIFIED OWNER</text>
    <text x="0" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="900" fill="#fff">Kagarama house</text>
    <text x="0" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="900" fill="#fff">ready for direct deal</text>
    <text x="0" y="214" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#cfe3e8">5 bedrooms • 5 bathrooms • 4-car parking • tarmac road</text>
    <g transform="translate(0 268)" filter="url(#shadow)">
      <rect x="0" y="0" width="310" height="94" rx="18" fill="#fff"/>
      <text x="28" y="34" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#5c727d">ASKING PRICE</text>
      <text x="28" y="70" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#071c1f">350M Rwf</text>
    </g>
    <g transform="translate(340 268)" filter="url(#shadow)">
      <rect x="0" y="0" width="260" height="94" rx="18" fill="#fff"/>
      <text x="28" y="34" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#5c727d">PUBLIC AREA</text>
      <text x="28" y="70" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" fill="#071c1f">Kicukiro</text>
    </g>
    <g transform="translate(0 398)">
      <rect x="0" y="0" width="250" height="58" rx="8" fill="#faa603"/>
      <text x="125" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#071c1f">BROWSE LISTINGS</text>
      <rect x="276" y="0" width="250" height="58" rx="8" fill="none" stroke="#fff" stroke-opacity="0.65"/>
      <text x="401" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#fff">TOKEN UNLOCK</text>
    </g>
  </g>

  <g transform="translate(1255 98)" filter="url(#shadow)">
    <rect width="455" height="120" rx="18" fill="#fff" opacity="0.94"/>
    <text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900" fill="#15b0dd">GETOWNERINFO</text>
    <text x="30" y="78" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#071c1f">Exact contact stays private</text>
    <text x="30" y="104" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5c727d">Unlock only when buyer intent is clear.</text>
  </g>
</svg>
